<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Muestra tu IP pública y toda su información con estilo vaporwave retro." />
  <meta property="og:title" content="Tu IP Pública - Estilo Retro Pixel" />
  <meta property="og:description" content="Descubre tu IP pública, ubicación y detalles de red. Diseño Vaporwave." />
  <title>Tu IP Pública</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/scrollreveal"></script>

  <style>
    :root {
      --pink: #ff6ec7;
      --lilac: #9d7fff;
      --neon-green: #39ff14;
      --background-dark: #0d0d0d;
      --background-light: #f2f2f2;
      --text-light: #fefefe;
      --text-dark: #111;
    }

    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      background: linear-gradient(135deg, var(--pink), var(--lilac));
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: all 0.5s ease;
    }

    body.dark {
      background: linear-gradient(135deg, #1e0036, #3a015c);
      color: var(--text-light);
    }

    header {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
      padding: 10px;
    }

    .toggle-theme {
      position: absolute;
      top: 10px;
      right: 20px;
      background: var(--neon-green);
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.6rem;
      transition: background 0.3s;
    }

    .toggle-theme:hover {
      background: #28c700;
    }

    .ip {
      font-size: 1rem;
      margin-bottom: 15px;
      text-align: center;
      word-break: break-word;
    }

    .btn-copy {
      background: var(--neon-green);
      border: none;
      padding: 10px 20px;
      font-size: 0.8rem;
      border-radius: 10px;
      margin-bottom: 30px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-copy:hover {
      background: #28c700;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 20px var(--neon-green);
      margin-bottom: 30px;
      animation: fadeIn 1.5s ease forwards;
    }

    body:not(.dark) .card {
      background: #ffffffcc;
      color: var(--text-dark);
      box-shadow: 0 0 20px #ff8dfd;
    }

    body:not(.dark) .label {
      color: #333;
    }

    body:not(.dark) .value {
      color: #000;
    }

    .info {
      margin: 15px 0;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      border-bottom: 1px dashed var(--lilac);
      padding-bottom: 8px;
    }

    .label {
      color: var(--pink);
    }

    .value {
      color: var(--neon-green);
    }

    #map {
      display: none !important;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    footer {
      margin-top: auto;
      font-size: 0.7rem;
      color: var(--text-light);
      text-align: center;
      padding: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <header>
    <h1>Tu IP Pública</h1>
    <button class="toggle-theme" onclick="toggleTheme()">Modo Claro</button>
  </header>

  <div class="ip" id="ip">Cargando...</div>
  <button class="btn-copy" onclick="copiarIP()">Copiar IP</button>

  <div class="card" id="details">
    <div class="info"><span class="label">País:</span><span class="value">...</span></div>
    <div class="info"><span class="label">Ciudad:</span><span class="value">...</span></div>
    <div class="info"><span class="label">Región:</span><span class="value">...</span></div>
    <div class="info"><span class="label">Código Postal:</span><span class="value">...</span></div>
    <div class="info"><span class="label">ISP:</span><span class="value">...</span></div>
    <div class="info"><span class="label">Latitud:</span><span class="value">...</span></div>
    <div class="info"><span class="label">Longitud:</span><span class="value">...</span></div>
    <div class="info"><span class="label">Tipo de IP:</span><span class="value">...</span></div>
  </div>

  <div id="map"></div> <!-- Oculto completamente -->

  <div id="google-map-section" class="card" style="display:none;">
    <div class="info"><span class="label">Google Maps:</span></div>
    <iframe id="google-map" width="100%" height="250" frameborder="0" style="border:0; border-radius: 10px;" allowfullscreen></iframe>
  </div>

  <div id="qr-section" class="card" style="display:none;">
    <div class="info"><span class="label">Código QR de tu IP:</span></div>
    <img id="qr-image" src="" alt="QR de IP" style="margin-top: 10px; width: 200px; height: 200px;" />
  </div>

  <footer>
    © 2025 TuSitio Vaporwave. Todos los derechos reservados.
  </footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    async function cargarIPInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();

        document.getElementById('ip').textContent = data.ip || 'No disponible';
        const values = document.querySelectorAll('.value');
        values[0].textContent = data.country_name || 'N/A';
        values[1].textContent = data.city || 'N/A';
        values[2].textContent = data.region || 'N/A';
        values[3].textContent = data.postal || 'N/A';
        values[4].textContent = data.org || 'N/A';
        values[5].textContent = data.latitude || 'N/A';
        values[6].textContent = data.longitude || 'N/A';
        values[7].textContent = data.version || 'N/A';

        if (data.latitude && data.longitude) {
          const map = L.map('map').setView([data.latitude, data.longitude], 10);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          L.marker([data.latitude, data.longitude]).addTo(map)
            .bindPopup('Ubicación Aproximada')
            .openPopup();

          // Mostrar mapa de Google embebido
          const gMap = document.getElementById('google-map');
          gMap.src = `https://maps.google.com/maps?q=${data.latitude},${data.longitude}&z=14&output=embed`;
          document.getElementById('google-map-section').style.display = 'block';
        }

        if (data.ip) {
          const qrImg = document.getElementById('qr-image');
          qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?data=${data.ip}&size=200x200`;
          document.getElementById('qr-section').style.display = 'block';
        }
      } catch (error) {
        console.error('Error obteniendo IP:', error);
        document.getElementById('ip').textContent = 'Error al cargar IP';
      }
    }

    function copiarIP() {
      const ip = document.getElementById('ip').textContent;
      navigator.clipboard.writeText(ip).then(() => {
        showToast('IP copiada al portapapeles!');
      });
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const btn = document.querySelector('.toggle-theme');
      btn.textContent = document.body.classList.contains('dark') ? 'Modo Claro' : 'Modo Oscuro';
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.textContent = message;
      toast.style.position = 'fixed';
      toast.style.bottom = '20px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.background = 'rgba(0,0,0,0.7)';
      toast.style.color = '#fff';
      toast.style.padding = '10px 20px';
      toast.style.borderRadius = '10px';
      toast.style.fontSize = '0.8rem';
      toast.style.zIndex = 9999;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    cargarIPInfo();

    ScrollReveal().reveal('.card', { delay: 400, duration: 1200, origin: 'bottom', distance: '30px' });
    ScrollReveal().reveal('.btn-copy', { delay: 600, duration: 1000, origin: 'top', distance: '20px' });
  </script>
</body>
</html>
